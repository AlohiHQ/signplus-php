name: Release
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/release.yml'
      - 'composer.json'
  workflow_dispatch:

env:
  # SDK identity baked in at generation time from the in-memory build context,
  # so the workflow never reads composer.json at runtime.
  SDK_VERSION: '1.0.0'
  SDK_PACKAGE_NAME: 'alohi/signplus'
  RELEASE_TAG: 'v1.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create tag if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/git/refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::Tag $RELEASE_TAG already exists, nothing to do"
            exit 0
          fi
          gh api -X POST "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="${{ github.sha }}"
          echo "::notice::Created tag $RELEASE_TAG at ${{ github.sha }}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          fi
      # Packagist derives versions from git tags and syncs via a VCS webhook, so
      # the tag + GitHub release created above is the real publish signal. The
      # ping below is an optional hint that asks Packagist to sync immediately;
      # in practice the configured webhook usually handles the sync on its own.
      # It only runs when both Packagist credentials are present.
      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_API_TOKEN" ]; then
            echo "::notice::Packagist credentials not set, relying on the VCS webhook to sync $SDK_PACKAGE_NAME"
            exit 0
          fi
          curl -XPOST -H 'content-type:application/json' \
            "https://packagist.org/api/update-package?username=$PACKAGIST_USERNAME&apiToken=$PACKAGIST_API_TOKEN" \
            -d "{\"repository\":{\"url\":\"https://github.com/${{ github.repository }}\"}}"
